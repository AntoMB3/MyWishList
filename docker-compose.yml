# ==========================================================================
# MyWishList — Docker Compose (FastAPI + frontend estático + SQLite)
# --------------------------------------------------------------------------
# Uso:
#   cp .env.example .env        # define SECRET_KEY (openssl rand -hex 32)
#   docker compose up -d --build
#   docker compose logs -f
#
# La base de datos SQLite y las fotos subidas viven en el volumen
# `mywishlist-data` (/data), así que sobreviven a recrear el contenedor.
# ==========================================================================

services:
  mywishlist:
    build:
      context: .
      dockerfile: Dockerfile
    image: mywishlist:latest
    restart: unless-stopped

    environment:
      # Obligatoria: sin una clave real la aplicación se niega a arrancar.
      SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY en el archivo .env (openssl rand -hex 32)}
      PORT: "8000"

      # Persistencia: base de datos y fotos dentro del volumen /data.
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/whishlist.db}
      MEDIA_DIR: ${MEDIA_DIR:-/data/media}

      # Tokens JWT
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}

      # Límites de negocio
      MAX_WISHLISTS_PER_USER: ${MAX_WISHLISTS_PER_USER:-5}
      MAX_ITEMS_PER_WISHLIST: ${MAX_ITEMS_PER_WISHLIST:-20}

      # Límites de peticiones (fuerza bruta y abuso de CPU/ancho de banda)
      RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE:-10}
      RATE_LIMIT_REGISTER_PER_HOUR: ${RATE_LIMIT_REGISTER_PER_HOUR:-5}
      RATE_LIMIT_MEDIA_PER_MINUTE: ${RATE_LIMIT_MEDIA_PER_MINUTE:-10}
      RATE_LIMIT_UNFURL_PER_MINUTE: ${RATE_LIMIT_UNFURL_PER_MINUTE:-10}

      # Swagger UI. En producción se deja oculta por defecto; pon
      # ENABLE_DOCS=1 en .env (por ejemplo, en staging) para verla.
      ENABLE_DOCS: ${ENABLE_DOCS:-false}

      # Si hay un proxy inverso delante, define FORWARDED_ALLOW_IPS con su
      # IP (o * si el contenedor solo es accesible a través del proxy) para
      # que el rate limit use la IP real del cliente.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}

    ports:
      # Cambia APP_PORT en .env si el 8000 del host está ocupado.
      - "${APP_PORT:-8000}:8000"

    volumes:
      - mywishlist-data:/data

    healthcheck:
      # /api/config es público y barato: sirve como sonda de vida.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/config', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  mywishlist-data:
