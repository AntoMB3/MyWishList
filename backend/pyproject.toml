[project]
name = "backend"
version = "0.1.0"
description = "Backend server to manage busisness logic and database through REST endpoints."
readme = "README.md"
authors = [
    { name = "Antonio Munoz", email = "antonio.munoz@isavanzados.com.mx" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.164.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
backend = "backend.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
