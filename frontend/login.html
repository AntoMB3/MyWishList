<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0f">
  <title>Iniciar sesión · MyWishList</title>
  <meta name="description" content="Accede a tus listas de deseos en MyWishList.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="login">

  <main class="auth">

    <div class="auth__inner">

      <a class="brand auth__brand" href="login.html">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.7-7.5 1.1-1.1a5.5 5.5 0 0 0 0-7.8Z"/>
          </svg>
        </span>
        <span class="brand__name">My<span>WishList</span></span>
      </a>

      <header class="auth__head">
        <h1 id="auth-title">Bienvenido de nuevo</h1>
        <p id="auth-subtitle">Entra para gestionar tus listas de deseos.</p>
      </header>

      <div class="auth-card">

        <div class="tabs" role="tablist" aria-label="Acceso o registro">
          <button class="tabs__btn is-active" type="button" role="tab" aria-selected="true"
                  data-auth-tab="login" data-title="Bienvenido de nuevo"
                  data-subtitle="Entra para gestionar tus listas de deseos.">
            Iniciar sesión
          </button>
          <button class="tabs__btn" type="button" role="tab" aria-selected="false"
                  data-auth-tab="register" data-title="Crea tu cuenta"
                  data-subtitle="Solo necesitas un usuario y una contraseña.">
            Crear cuenta
          </button>
        </div>

        <!-- Login -->
        <form class="auth-form" id="login-form" data-auth-panel="login" novalidate>
          <div class="field">
            <label class="field__label" for="login-username">Usuario</label>
            <input class="input" id="login-username" name="username" type="text"
                   autocomplete="username" placeholder="tu_usuario" required minlength="3" maxlength="30">
            <span class="field__hint">Entre 3 y 30 caracteres: letras, números, guiones o guion bajo.</span>
          </div>

          <div class="field">
            <label class="field__label" for="login-password">Contraseña</label>
            <div class="input-group">
              <input class="input" id="login-password" name="password" type="password"
                     autocomplete="current-password" placeholder="Tu contraseña" required minlength="8">
              <button class="input-group__btn" type="button" data-toggle-password="login-password"
                      aria-label="Mostrar contraseña" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="auth-form__row">
            <label class="checkbox">
              <input type="checkbox" name="remember" checked>
              Recordarme
            </label>
            <button class="link-button" type="button" data-action="forgot-password">¿Olvidaste tu contraseña?</button>
          </div>

          <button class="btn btn--primary btn--block" type="submit">
            Entrar
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M13 6l6 6-6 6"/>
            </svg>
          </button>
        </form>

        <!-- Registro -->
        <form class="auth-form" id="register-form" data-auth-panel="register" hidden novalidate>
          <div class="field">
            <label class="field__label" for="register-username">Usuario</label>
            <input class="input" id="register-username" name="username" type="text"
                   autocomplete="username" placeholder="tu_usuario" required minlength="3" maxlength="30">
            <span class="field__hint">Se guardará en minúsculas y será visible al compartir tus listas.</span>
          </div>

          <div class="field">
            <label class="field__label" for="register-password">Contraseña</label>
            <div class="input-group">
              <input class="input" id="register-password" name="password" type="password"
                     autocomplete="new-password" placeholder="Mínimo 8 caracteres" required minlength="8" maxlength="128">
              <button class="input-group__btn" type="button" data-toggle-password="register-password"
                      aria-label="Mostrar contraseña" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="field">
            <label class="field__label" for="register-confirm">Confirmar contraseña</label>
            <input class="input" id="register-confirm" name="confirm" type="password"
                   autocomplete="new-password" placeholder="Repite tu contraseña" required minlength="8">
          </div>

          <label class="checkbox">
            <input type="checkbox" name="terms" required>
            Acepto los términos y la política de privacidad.
          </label>

          <button class="btn btn--primary btn--block" type="submit">
            Crear cuenta
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 5v14M5 12h14"/>
            </svg>
          </button>
        </form>

      </div>

    </div>

  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
